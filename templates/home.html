{% extends "base.html" %}

{% block title %}Books | My Library{% endblock %}

{% block content %}

<section class="library">

    <h1 class="library__title mb-4">My Library</h1>

    <div class="table-responsive library__table-wrapper">
        <table class="table table-striped table-hover library__table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ISBN</th>
                    <th>Title</th>
                    <th>Publication Year</th>
                    <th>Author</th>
                </tr>
            </thead>

            <tbody>
                {% for book in books %}
                    <tr class="library__book">
                        <td>{{ book.id }}</td>
                        <td>{{ book.isbn }}</td>
                        <td>{{ book.title }}</td>
                        <td>{{ book.publication_year }}</td>
                        <td>{{ book.author.name }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</section>

{% endblock %}
